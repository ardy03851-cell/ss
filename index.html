<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Runner iPad Game</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UI Overlay */
    #ui {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      font-size: 28px;
      font-weight: 800;
      pointer-events: none;
    }

    /* iPad Touch Controls */
    .touch-zone {
      position: absolute;
      bottom: 40px;
      pointer-events: auto;
    }

    #joystick-area {
      left: 40px;
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      backdrop-filter: blur(4px);
    }

    #joystick-knob {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transform: translate(0, 0);
    }

    #jump-btn {
      right: 40px;
      width: 110px;
      height: 110px;
      background: rgba(255, 87, 34, 0.85);
      border: 3px solid #ffffff;
      border-radius: 50%;
      color: white;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    #jump-btn:active {
      background: rgba(255, 87, 34, 1);
      transform: scale(0.95);
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
  <div id="canvas-container"></div>
  <div id="ui">Score: <span id="score">0</span></div>

  <!-- iPad Controls -->
  <div id="joystick-area" class="touch-zone">
    <div id="joystick-knob"></div>
  </div>
  <div id="jump-btn" class="touch-zone">JUMP</div>

  <script>
    // Setup Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 20, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Score tracking
        let score = 0;
        const scoreElem = document.getElementById('score');

        // Player setup
        const playerGeom = new THREE.SphereGeometry(0.5, 16, 16);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3 });
        const player = new THREE.Mesh(playerGeom, playerMat);
        player.castShadow = true;
        player.position.set(0, 1.5, 0);
        scene.add(player);

        let velocityY = 0;
        let isGrounded = false;
        const gravity = -0.015;

        // Ground Grid Setup using Block.bbmodel
        const groundGroup = new THREE.Group();
        scene.add(groundGroup);

        const GRID_SIZE = 12;

        // Load Block.gltf model using GLTFLoader
        function loadBlockModel() {
            return new Promise((resolve) => {
                const loader = new THREE.GLTFLoader();
                loader.load(
                    'Block.gltf',
                    (gltf) => {
                        const modelGroup = gltf.scene;
                        modelGroup.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        resolve(modelGroup);
                    },
                    undefined,
                    (error) => {
                        // Fallback geometry if Block.gltf fails or is blocked by CORS
                        const geom = new THREE.BoxGeometry(1, 1, 1);
                        const mat = new THREE.MeshStandardMaterial({ color: 0x55aa55, roughness: 0.7 });
                        const mesh = new THREE.Mesh(geom, mat);
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        resolve(mesh);
                    }
                );
            });
        }

        // Build ground grid
        async function buildGround() {
            const blockTemplate = await loadBlockModel();
            
            for (let x = -GRID_SIZE; x <= GRID_SIZE; x++) {
                for (let z = -GRID_SIZE; z <= GRID_SIZE; z++) {
                    const block = blockTemplate.clone();
                    block.position.set(x, 0, z);
                    groundGroup.add(block);
                }
            }
            createCollectibles();
        }

        // Floating Collectibles
        const coins = [];
        function createCollectibles() {
            const coinGeom = new THREE.OctahedronGeometry(0.3);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });

            for (let i = 0; i < 15; i++) {
                const coin = new THREE.Mesh(coinGeom, coinMat);
                coin.position.set(
                    (Math.random() - 0.5) * (GRID_SIZE * 1.8),
                    1.2,
                    (Math.random() - 0.5) * (GRID_SIZE * 1.8)
                );
                scene.add(coin);
                coins.push(coin);
            }
        }

        buildGround();

        // Touch Joystick Logic
        const moveInput = { x: 0, y: 0 };
        const joystickArea = document.getElementById('joystick-area');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickTouchId = null;

        const maxRadius = 40;

        function handleTouchStart(e) {
            const rect = joystickArea.getBoundingClientRect();
            const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };

            for (let touch of e.changedTouches) {
                if (touch.clientX < window.innerWidth / 2 && joystickTouchId === null) {
                    joystickTouchId = touch.identifier;
                    updateJoystick(touch, center);
                }
            }
        }

        function handleTouchMove(e) {
            const rect = joystickArea.getBoundingClientRect();
            const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };

            for (let touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    updateJoystick(touch, center);
                }
            }
        }

        function resetJoystick() {
            joystickTouchId = null;
            moveInput.x = 0;
            moveInput.y = 0;
            joystickKnob.style.transform = `translate(0px, 0px)`;
        }

        function handleTouchEnd(e) {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystickTouchId) {
                    resetJoystick();
                }
            }
        }

        function updateJoystick(touch, center) {
            let dx = touch.clientX - center.x;
            let dy = touch.clientY - center.y;
            let dist = Math.hypot(dx, dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveInput.x = dx / maxRadius;
            moveInput.y = dy / maxRadius;
        }

        window.addEventListener('touchstart', handleTouchStart, { passive: false });
        window.addEventListener('touchmove', handleTouchMove, { passive: false });
        window.addEventListener('touchend', handleTouchEnd);
        window.addEventListener('touchcancel', resetJoystick);

        // Jump Button Control
        const jumpBtn = document.getElementById('jump-btn');
        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) {
                velocityY = 0.32;
                isGrounded = false;
            }
        });

        // Keyboard Fallback (for Desktop Testing)
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Handle Joystick or Keyboard Input
            let inputX = moveInput.x;
            let inputY = moveInput.y;

            if (keys['ArrowLeft'] || keys['a']) inputX = -1;
            if (keys['ArrowRight'] || keys['d']) inputX = 1;
            if (keys['ArrowUp'] || keys['w']) inputY = -1;
            if (keys['ArrowDown'] || keys['s']) inputY = 1;
            if (keys[' '] && isGrounded) { velocityY = 0.32; isGrounded = false; }

            // Apply Player Movement
            const speed = 0.14;
            player.position.x += inputX * speed;
            player.position.z += inputY * speed;

            // Physics & Collision
            player.position.y += velocityY;
            velocityY += gravity;

            const platformBound = GRID_SIZE + 0.5;
            if (Math.abs(player.position.x) <= platformBound && Math.abs(player.position.z) <= platformBound) {
                if (player.position.y <= 1.0) {
                    player.position.y = 1.0;
                    velocityY = 0;
                    isGrounded = true;
                }
            } else {
                // Respawn if player falls off the island
                if (player.position.y < -10) {
                    player.position.set(0, 5, 0);
                    velocityY = 0;
                }
            }

            // Collect Gems
            coins.forEach((coin) => {
                coin.rotation.y += 0.03;
                if (player.position.distanceTo(coin.position) < 0.8) {
                    score += 10;
                    scoreElem.textContent = score;
                    coin.position.set(
                        (Math.random() - 0.5) * (GRID_SIZE * 1.8),
                        1.2,
                        (Math.random() - 0.5) * (GRID_SIZE * 1.8)
                    );
                }
            });

            // Smooth Camera Tracking
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 6;
            camera.position.z = player.position.z + 8;
            camera.lookAt(player.position.x, player.position.y + 0.5, player.position.z);

            renderer.render(scene, camera);
        }

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
  </script>
</body>

</html>
